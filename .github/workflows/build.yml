name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck -s bash policy/apply.sh claude-nix/*.sh claude-nix/test/*.sh

  claude-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile itself checks the Nix version, the nixpkgs registry
      # pin and that direnv runs. The image is only built, never pushed.
      - name: Build
        run: docker build --pull -t claude-nix:ci claude-nix

      - name: Smoke test
        run: >-
          docker run --rm --entrypoint bash
          -v "$PWD/claude-nix/test:/test:ro"
          -e BASH_ENV=/etc/sandbox-persistent.sh
          claude-nix:ci /test/smoke.sh
