experimental-features = nix-command flakes
# Single-user install: no build users.
build-users-group =
# The microVM is the isolation boundary; Nix's own build sandbox needs
# user namespaces that may not be available inside it.
sandbox = false
max-jobs = auto
# Don't let a project's flake add substituters or settings on its own.
accept-flake-config = false
warn-dirty = false
# Local global registry pinning `nixpkgs` (written by the Dockerfile).
# Flake inputs like `inputs.nixpkgs.url = "nixpkgs"` resolve only via
# the global registry, not the user one, so the pin must live here.
flake-registry = /etc/nix/flake-registry.json
